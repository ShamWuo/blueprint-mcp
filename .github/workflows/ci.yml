name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Test, Typecheck & Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify tarball (offline)
        env:
          MCP_VERIFY_SKIP_NETWORK: "1"
        run: npm run verify:pack

      - name: Validate server.json schema
        run: node scripts/validate-server-json.mjs
